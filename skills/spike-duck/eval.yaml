# This is a generated eval.yaml template.
# Edit the tasks below to define evaluations for your skill.
#
# Usage:
#   skillgrade          Run all tasks
#   skillgrade --validate   Verify graders using reference solutions
#   skillgrade --preview    Open web UI for results
#
# Documentation: https://github.com/mgechev/skillgrade#readme

version: "1"

defaults:
  agent: acp # gemini | claude | codex | acp | opencode | command
  acp:
    command: "agent acp"
    env:
      DEBUG: "1"
  provider: local # docker | local (use local for quick iteration)
  trials: 3 # number of independent runs per task
  timeout: 120 # seconds before agent is killed
  threshold: 0.8 # minimum pass rate for --ci mode
  # grader_model: claude-sonnet-5   # pin the LLM judge's model (default: latest, resolved via the provider's API)
  #                                 # env vars override the default too: ANTHROPIC_MODEL / OPENAI_MODEL / GEMINI_MODEL
  # docker:
  #   base: node:20-slim # base Docker image
  # setup: |            # extra setup commands (uncomment if needed)
  #   apt-get update && apt-get install -y <packages>

tasks:
  - name: test-spike-duck
    instruction: |
      Do a time-boxed spike to answer the question:
         "How do I write an eval with skillgrade using a Cursor acp agent?""
      Complete the spike within 30 seconds. Just gather as much information as possible in the time available.

    workspace:
      # Files to copy into the agent's workspace before it starts.
      # - src: fixtures/broken-file.js
      #   dest: app.js
      # - src: bin/my-tool
      #   dest: /usr/local/bin/my-tool
      #   chmod: "+x"

    graders:
      - type: deterministic
        # setup: npm install typescript  # install grader dependencies (optional)
        run: |
          # Grader must output JSON: { "score": 0.0-1.0, "details": "...", "checks": [...] }
          if compgen -G "*.md" > /dev/null; then
            echo '{"score": 1.0, "details": "All checks passed", "checks": [{"name": "file-exists", "passed": true, "message": "Found expected output"}]}'
          else
            echo '{"score": 0.0, "details": "Check failed", "checks": [{"name": "file-exists", "passed": false, "message": "Missing expected output"}]}'
          fi
        weight: 0.7

      # - type: llm_rubric
      #   rubric: |
      #     Spike results:
      #     - Does the spike results Markdown file exist?
      #     - Does the spike results Markdown file contents describe how to write an eval with skillgrade using a Cursor acp agent?
      #   weight: 0.3

    # Optional: reference solution for --validate
    # solution: solutions/solve.sh
