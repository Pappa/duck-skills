interface:
  display_name: "amigo-pato"
  short_description: "Reviews backlog tickets and requirements before publish — fit to the user's request, completeness, unambiguous acceptance criteria, ISO 24495 plain language, and INVEST. Use when creating or updating a backlog ticket, user story, work item, or issue; when drafting acceptance criteria; when the user invokes amigo-pato; or when another skill is about to publish to the backlog."
